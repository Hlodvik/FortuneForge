name: fortuneforge-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify monorepo game ownership
        run: npm run verify:game-source

      - name: Restore .NET dependencies
        run: |
          dotnet restore FortuneForge.slnx
          dotnet restore game-packages/FortuneForge.Games.slnx
          dotnet restore tools/FortuneForge.SlotMath/FortuneForge.SlotMath.csproj

      - name: Build .NET
        run: |
          dotnet build FortuneForge.slnx --configuration Release --no-restore
          dotnet build game-packages/FortuneForge.Games.slnx --configuration Release --no-restore

      - name: Test game packages
        run: dotnet test game-packages/FortuneForge.Games.slnx --configuration Release --no-build

      - name: Audit .NET dependencies
        run: |
          while IFS= read -r project; do
            dotnet list "$project" package --vulnerable --include-transitive --no-restore
          done < <(find . -name '*.csproj' -print)

      - name: Install Firestore emulator CLI
        run: |
          npm install --global firebase-tools@14.4.0
          firebase setup:emulators:firestore

      - name: Test server
        run: |
          firebase emulators:exec \
            --only firestore \
            --project demo-fortuneforge-ci-tests \
            --config FortuneForge.Server.Tests/Cards/TexasHoldem/Credit/firebase-emulator.test.json \
            'dotnet test FortuneForge.Server.Tests/FortuneForge.Server.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"'

      - name: Install frontend dependencies
        run: npm ci

      - name: Check game clients and frontend
        run: |
          npm run games:check
          npm run games:test
          npm run build
          npm run web:test
          npm run web:lint
          npm audit --audit-level=high

      - name: Build deployment image
        run: docker build --file Dockerfile --tag fortuneforge:ci .
