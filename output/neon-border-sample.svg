  <g transform="translate(717 119)"><use href="#dividers"/><use href="#symbols"/></g>
  <rect x="715.5" y="114.5" width="579" height="346" rx="10" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>
