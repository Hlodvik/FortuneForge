  <text x="1005" y="52" text-anchor="middle" fill="#e3c7f4" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="3">DISCO ROUND</text>
  <rect x="27" y="74" width="616" height="407" rx="17" fill="url(#stage)"/>
  <rect x="697" y="74" width="616" height="407" rx="17" fill="url(#stage)"/>
  <g opacity=".2" stroke="#35507b" stroke-width="2"><path d="M25 430h620 M25 374h620 M695 430h620 M695 374h620"/></g>
  <rect x="43" y="112" width="584" height="351" rx="12" fill="none" stroke="#57a8d8" stroke-width="9" opacity=".35" filter="url(#regularGlow)"/>
  <rect x="713" y="112" width="584" height="351" rx="12" fill="none" stroke="#a575e1" stroke-width="12" opacity=".55" filter="url(#discoGlow)"/>
  <rect x="44" y="113" width="582" height="349" rx="11" fill="url(#reels)" stroke="url(#regular)" stroke-width="3"/>
