<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 540" role="img" aria-label="Neon Nights regular and Disco border comparison">
  <defs>
    <linearGradient id="stage" x2="0" y2="1"><stop stop-color="#101a38"/><stop offset="1" stop-color="#080d23"/></linearGradient>
    <linearGradient id="reels" x2="0" y2="1"><stop stop-color="#101e35"/><stop offset=".52" stop-color="#0c122b"/><stop offset="1" stop-color="#251029"/></linearGradient>
    <linearGradient id="regular" x2="1" y2=".45"><stop stop-color="#c9ecf5"/><stop offset=".19" stop-color="#71a9ca"/><stop offset=".45" stop-color="#24395f"/><stop offset=".76" stop-color="#4b477d"/><stop offset="1" stop-color="#9fc4df"/></linearGradient>
    <linearGradient id="disco" x2="1" y2=".45"><stop stop-color="#ecf5ff"/><stop offset=".2" stop-color="#92d9ef"/><stop offset=".42" stop-color="#6651bd"/><stop offset=".68" stop-color="#d65cc4"/><stop offset="1" stop-color="#dfe9fb"/></linearGradient>
    <linearGradient id="type" x2="0" y2="1"><stop stop-color="#fbf7ff"/><stop offset=".45" stop-color="#aabcee"/><stop offset="1" stop-color="#d56fd0"/></linearGradient>
    <filter id="regularGlow" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="discoGlow" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="13"/></filter>
    <g id="symbols" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" fill="url(#type)" stroke="#61a8d4" stroke-width=".7" paint-order="stroke" font-size="67">
      <text x="56" y="106">Q</text><text x="172" y="106">K</text><text x="288" y="106">A</text><text x="404" y="106">J</text><text x="520" y="106">Q</text>
      <text x="56" y="213">A</text><text x="172" y="213">J</text><text x="288" y="213">K</text><text x="404" y="213">Q</text><text x="520" y="213">A</text>
      <text x="56" y="319">K</text><text x="172" y="319">A</text><text x="288" y="319" font-size="51" fill="#e887db">777</text><text x="404" y="319">J</text><text x="520" y="319">Q</text>
    </g>
    <g id="dividers" stroke="#8e6a67" stroke-opacity=".38" stroke-width="1"><path d="M114 20v320 M230 20v320 M346 20v320 M462 20v320"/></g>
